name: Release

# Every push to master (normally a merged PR) becomes a release. The merged PR's label picks the bump:
# release:major, release:minor, none = patch, release:skip = no release.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          labels="" title=""
          if [ -n "$pr" ]; then
            labels=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')
            title=$(gh pr view "$pr" --json title --jq .title)
          fi
          case ",$labels," in *,release:skip,*) echo "release:skip on #$pr, no release"; exit 0 ;; esac

          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<<"${last:-v0.0.0}"
          major=${major#v}
          case ",$labels," in
            *,release:major,*) next="v$((major + 1)).0.0" ;;
            *,release:minor,*) next="v$major.$((minor + 1)).0" ;;
            *) next="v$major.$minor.$((patch + 1))" ;;
          esac

          upstream=$(cat upstream.rev)
          {
            echo "Built against upstream [caelestia-dots/shell@${upstream:0:8}](https://github.com/caelestia-dots/shell/commit/$upstream)."
            echo
            echo "Use this version:"
            echo
            echo '```sh'
            echo "git fetch --tags && git checkout $next && ./build.py"
            echo "systemctl --user restart niri-caelestia.service"
            echo '```'
          } >notes.md
          start=()
          [ -n "$last" ] && start=(--notes-start-tag "$last")
          gh release create "$next" --target "$GITHUB_SHA" --title "$next${title:+: $title}" --notes-file notes.md --generate-notes "${start[@]}"
          echo "released $next (after ${last:-nothing}, labels: ${labels:-none})"
